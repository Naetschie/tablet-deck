# Prüfung bei jedem Push und Pull Request: Unit-Tests und die Regeln für beigetragene Panels/Dashboards.
# Windows, weil der Hub Windows-Bibliotheken nutzt (pycaw, SendInput).
name: Prüfung

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Abhängigkeiten
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Panels und Dashboards (Regeln für Beiträge)
        run: python scripts/check_contrib.py
      - name: Unit-Tests
        run: python -m unittest discover -s tests -q
