<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="/lib/base.css">
<link rel="stylesheet" href="/lib/ui.css">
<title>Ton</title>
<!-- Aufklappfeld des Launchers (ca. 360 x 540 px), hochkant als Blatt von unten; läuft auch als eigene Kachel -->
<style>
  html { background: var(--s1); }
  body { background: var(--s1); display: flex; flex-direction: column; gap: var(--sp-4); padding: var(--sp-4);
    max-width: 560px; margin: 0 auto; }
  /* Regler mit Beschriftung links und Prozent rechts, daneben Stumm: gleich für Gesamt und jede App */
  .row { display: flex; gap: var(--sp-2); flex: none; }
  .row .slider { flex: 1; min-width: 0; height: var(--hit); }
  .row .nm { position: absolute; left: var(--sp-3); right: 64px; top: 0; bottom: 0; display: flex;
    align-items: center; font: 600 var(--fs-sm) var(--fb); color: var(--tx); pointer-events: none; }
  .row .nm span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .row .key { flex: none; width: var(--hit); min-height: var(--hit); padding: 0; }
  .row .key.on { background: var(--badSoft); border-color: var(--bad); color: var(--tx); }
  .master .slider { height: 56px; }
  .master .nm { font-size: var(--fs-md); }
  .master .key { width: 56px; min-height: 56px; }

  .mixer { flex: 1 1 auto; min-height: 148px; display: flex; flex-direction: column; gap: var(--sp-2); }
  #apps { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: var(--sp-2);
    touch-action: pan-y; }
  #apps .slider, #apps .key { touch-action: pan-y; }
  #apps.empty::before { content: "Gerade gibt keine App Ton aus"; color: var(--dim); font: 500 var(--fs-sm) var(--fb);
    padding: var(--sp-3) 0; }
  /* Ausgabe: ein Knopf mit dem aktuellen Gerät; die Liste ersetzt beim Antippen die Apps */
  #out { flex: none; min-height: var(--hit); flex-direction: row; gap: var(--sp-2); justify-content: flex-start;
    padding: 0 var(--sp-3); font: 600 var(--fs-sm) var(--fb); }
  #out .lbl { color: var(--dim); flex: none; }
  #out .cur { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-align: left; }
  #out .ic { width: 18px; height: 18px; color: var(--dim); transition: transform var(--dur); }
  .pick #out .ic { transform: rotate(180deg); }
  #outs { display: none; flex: 1 1 auto; min-height: 0; flex-direction: column; gap: var(--sp-2); overflow-y: auto;
    touch-action: pan-y; }
  .mixer.pick #outs { display: flex; }
  .mixer.pick #apps { display: none; }
  #outs .chip { touch-action: pan-y; flex: none; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    display: block; line-height: 46px; text-align: left; }
  #mixnote { flex: none; font: 500 var(--fs-sm) var(--fb); color: var(--tx); background: var(--badSoft);
    border: 1px solid var(--bad); border-radius: var(--r); padding: var(--sp-2) var(--sp-3); }

  .transport { flex: none; display: flex; justify-content: space-between; align-items: center; }
  .transport .key { width: 52px; height: 52px; min-height: 0; }
  .transport .key.primary { width: 64px; height: 64px; }

  /* nur von der Touchpad-Seite einer älteren Launcher-App (ohne Ton-Knopf) verlinkt */
  #back { flex: none; display: none; text-decoration: none; }
  .back #back { display: flex; }

  /* niedrig (Handy quer): die Seite selbst scrollt */
  @media (max-height: 420px) {
    html, body { height: auto; }
    html { overflow-y: auto; touch-action: pan-y; }
    body { overflow: visible; touch-action: pan-y; }
    #apps, #outs { overflow: visible; }
  }
</style>
</head>
<body>
<a id="back" class="key" href="/touchpad/">Zurück zum Touchpad</a>
<section class="row master" aria-label="Lautstärke">
  <div id="vol" class="slider" aria-label="Lautstärke"><div class="fill" id="fill"></div>
    <div class="nm"><span>Lautstärke</span></div><div class="val" id="pct">–</div></div>
  <div class="key" id="mute" role="button" aria-label="Stumm" aria-pressed="false"><svg class="ic"><use href="/lib/icons.svg#vol-up"/></svg></div>
</section>
<section class="mixer" aria-label="Mixer">
  <div id="apps" aria-label="Lautstärke je App"></div>
  <div id="outs" aria-label="Ausgabegerät wählen"></div>
  <div id="mixnote" role="status" hidden></div>
  <div class="key" id="out" role="button" aria-label="Ausgabegerät"><span class="lbl">Ausgabe</span><span class="cur">–</span><svg class="ic" aria-hidden="true"><use href="/lib/icons.svg#chevron-down"/></svg></div>
</section>
<section class="transport" aria-label="Wiedergabe">
  <div class="key round" data-media="voldown" role="button" aria-label="Leiser"><svg class="ic"><use href="/lib/icons.svg#vol-minus"/></svg></div>
  <div class="key round" data-media="prev" role="button" aria-label="Zurück"><svg class="ic"><use href="/lib/icons.svg#prev"/></svg></div>
  <div class="key round primary" data-media="playpause" role="button" aria-label="Wiedergabe oder Pause"><svg class="ic"><use href="/lib/icons.svg#play-pause"/></svg></div>
  <div class="key round" data-media="next" role="button" aria-label="Weiter"><svg class="ic"><use href="/lib/icons.svg#next"/></svg></div>
  <div class="key round" data-media="volup" role="button" aria-label="Lauter"><svg class="ic"><use href="/lib/icons.svg#vol-plus"/></svg></div>
</section>
<script src="/lib/hub.js"></script>
<script src="media.js"></script>
<script src="mixer.js"></script>
</body>
</html>
